<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Đế Chế GameVui (The Imperium Remake) | PGame</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      letterbox: "on",
      quality: "high",
      scale: "showAll",
      forceScale: true,
      wmode: "opaque",
      autoplay: "on",
      unmuteOverlay: "hidden",
      splashScreen: false,
      allowScriptAccess: true
    };
  </script>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    #player-wrap {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    ruffle-player {
      width: 100% !important;
      height: 100% !important;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      transform: translateZ(0);
    }
    ruffle-player canvas {
      image-rendering: auto !important;
    }
    .web-exit-btn {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 1000;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      transition: all 0.2s ease;
    }
    .web-exit-btn:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.7);
    }
    .fullscreen-btn {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 1000;
      background: rgba(17, 24, 39, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 9px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease;
    }
    .fullscreen-btn:hover {
      background: rgba(99, 102, 241, 0.9);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <!-- Web-Level Exit Button Back to Main Portal -->
  <a href="/" class="web-exit-btn">
    <i class="fa-solid fa-arrow-left"></i> Thoát Game (Về Trang Chủ)
  </a>
  <button class="fullscreen-btn" onclick="toggleFs()">
    <i class="fa-solid fa-expand"></i> Toàn Màn Hình
  </button>

  <div id="player-wrap"></div>

  <script>
    function toggleFs() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("player-wrap").appendChild(player);

      player.load({
        url: "imperium_modded.swf?v=" + Date.now(),
        letterbox: "on",
        quality: "high",
        autoplay: "on",
        unmuteOverlay: "hidden",
        scale: "showAll",
        forceScale: true,
        wmode: "opaque"
      });
    });
  </script>
</body>
</html>
